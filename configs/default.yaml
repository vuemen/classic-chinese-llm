# 通用默认配置 — 被 pretrain.yaml / sft.yaml 继承和覆盖
seed: 42
dtype: "bf16"

logging:
  level: "INFO"
  log_dir: "logs"

paths:
  data_dir: "data"
  model_dir: "models"
  checkpoint_dir: "models/checkpoints"

model:
  vocab_size: 32000
  d_model: 768
  n_layers: 14
  n_heads: 12
  d_ff: 3072
  max_seq_len: 2048
  dropout: 0.0
