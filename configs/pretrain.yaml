# 预训练配置 — 继承 default.yaml
extends: "default.yaml"

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 1000
  max_steps: 100000
  eval_every: 500
  save_every: 2000
  max_checkpoints: 5

optimizer:
  name: "adamw"
  betas: [0.9, 0.95]
  eps: 1.0e-8

scheduler:
  name: "cosine"
  min_lr: 3.0e-5
