[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-chinese-llm"
version = "0.1.0"
description = "Classical Chinese conversational LLM — a ~157M Decoder-only Transformer built from scratch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.14"

dependencies = [
    "torch>=2.4.0",
    "datasets>=2.21.0",
    "accelerate>=0.34.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.20.0",
    "transformers>=4.45.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
data = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "datasketch>=1.6",
    "chardet>=5.0",
]
chat = [
    "gradio>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
]
dev = [
    "black>=24.0",
    "ruff>=0.7",
    "mypy>=1.12",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
classic-llm-collect = "scripts.collect_data:main"
classic-llm-train-tokenizer = "scripts.train_tokenizer:main"
classic-llm-pretrain = "scripts.pretrain:main"
classic-llm-finetune = "scripts.finetune:main"
classic-llm-chat = "scripts.chat:main"
classic-llm-serve = "scripts.serve:main"

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.py$'
extend-exclude = '''
/(
  | \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",
    "N",
    "B",
    "SIM",
    "C4",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["classic_chinese_llm"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = "build|dist|\\.venv|\\.tox"

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tokenizers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
